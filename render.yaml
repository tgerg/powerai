services:
  - type: web
    name: powerai
    env: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt && cd frontend && npm install && npm run build
    startCommand: cd backend && python app.py
    envVars:
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: GROQ_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: powerai-db
          property: connectionString

databases:
  - name: powerai-db
    databaseName: powerai
    plan: free